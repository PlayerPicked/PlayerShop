prefix: "&#FF8A65[PlayerShop]"

messages:
  reload: "%prefix% &aReloaded!"
  update-available: "%prefix% &a  A new version is available! &7(&c{current} &7→ &a{new}&7)"
  no-permission: "%prefix% &cYou don't have permission!"
  player-required: "%prefix% &cOnly players can use this!"
  player-not-found: "%prefix% &cPlayer not found!"
  missing-argument: "%prefix% &cMissing argument!"

  shop:
    storage-not-empty: "%prefix% &cStorage must be empty to switch mode!"
    storage-not-empty-simple: "%prefix% &cStorage must be empty!"

    admin-deleted: "%prefix% &aYou deleted &e{owner}&a's shop!"
    admin-delete-confirm: "%prefix% &c&lWARNING! &7This shop belongs to &e{owner}&7! Repeat the action within &e{seconds}s &7to delete it permanently."
    admin-delete-no-target: "%prefix% &cYou are not looking at a player shop!"
    deleted: "%prefix% &aShop deleted!"

    transaction-success: "%prefix% &aYou {mode} &e{amount}x {item} &afor &e{price} &afrom &e{owner}"
    transaction-failed: "%prefix% &cTransaction failed!"

    owner-notify:
      buy: "&e{player} &abought &e{amount}x {item} &afor &e{price}{currency} &afrom your shop"
      sell: "&e{player} &csold &e{amount}x {item} &cfor &e{price}{currency} &cto your shop"

    errors:
      block-content-not-empty: "%prefix% &cBlock must be empty to create a shop!"
      double-chest: "%prefix% &cYou can't create a shop on a double chest!"
      not-enough-money: "%prefix% &cYou don't have enough money!"
      not-enough-items: "%prefix% &cYou don't have enough items!"
      inventory-full: "%prefix% &cYour inventory is full!"
      storage-full: "%prefix% &cShop storage is full!"
      owner-no-money: "%prefix% &cShop owner has no money!"
      shop-empty: "%prefix% &cShop is out of stock!"
      invalid-amount: "%prefix% &cInvalid amount!"

    currency-updated: "%prefix% &aCurrency updated to: &e{currency}"
    currency-no-permission: "%prefix% &cYou don't have permission to use &e{currency}&c!"

    limit-reached: "%prefix% &cYou have reached your shop limit! (&e{current}/{limit}&c)"
    creation-mode-enabled: "%prefix% &aShop creation mode enabled! Right-click a chest with the item you want to sell."
    creation-mode-disabled: "%prefix% &cShop creation mode disabled."

    listing:
      enabled: "%prefix% &aYour shop is now visible in &e/playershop search&a!"
      disabled: "%prefix% &7Your shop is now hidden from the search."

    visit:
      set: "%prefix% &aVisitors will now arrive at &e{x}, {y}, {z}&a."
      reset: "%prefix% &aVisit point cleared - a safe spot next to the shop will be picked automatically."
      too-far: "%prefix% &cStand within &e{distance} &cblocks of your shop to set the visit point! (&e{current}&c)"
      wrong-world: "%prefix% &cYou have to stand in the same world as your shop!"
      unsafe: "%prefix% &cThis spot is not safe for visitors, try another one!"

    mode:
      buy: "&#7CF6FFBuying"
      sell: "&#FF7C7CSelling"

    price:
      invalid-number: "%prefix% &cInvalid number!"
      negative: "%prefix% &cPrice must be greater than or equal to 0!"
      too-large: "%prefix% &cPrice is too large!"
      updated: "%prefix% &aPrice updated to: &e{price}"

  search:
    disabled: "%prefix% &cThe shop search is disabled!"
    too-short: "%prefix% &cType at least &e{min} &ccharacters!"
    searching: "%prefix% &7Searching for &f{query}&7..."
    no-results: "%prefix% &cNo listed shop trades &e{query}&c!"
    all-unavailable: "%prefix% &e{amount} &cshop(s) trade &e{query}&c, but none of them can trade right now (empty stock / full storage)."
    results: "%prefix% &aFound &e{amount} &ashop(s)."

  teleport:
    disabled: "%prefix% &cTeleporting to shops is disabled!"
    warmup: "%prefix% &7Teleporting in &e{seconds}s&7, don't move!"
    cancelled: "%prefix% &cTeleport cancelled!"
    cooldown: "%prefix% &cWait &e{seconds}s &cbefore teleporting again!"
    success: "%prefix% &aTeleported to &e{owner}&a's shop!"
    protection: "%prefix% &7You cannot take damage for &e{seconds}s&7 - attacking ends it."
    no-safe-location: "%prefix% &cNo safe spot could be found around that shop!"
    shop-gone: "%prefix% &cThat shop is not available anymore!"
    world-not-loaded: "%prefix% &cThat shop's world is not loaded!"
    world-blacklisted: "%prefix% &cYou cannot teleport into that world!"
    failed: "%prefix% &cThe teleport failed!"

  island:
    locked: "%prefix% &cThat island is closed!"
    banned: "%prefix% &cYou are banned from that island!"

  dialog:
    price:
      title: "&#B8FFF2Set Price"
      body:
        - "&#7A8592Enter price"
        - "&#7A8592Example: 10.5"
      input: "&#C7D0D9Price"

    confirm: "&#7CF6FFConfirm"
    confirm-lore: "&#C7D0D9Click to confirm"

    cancel: "&#7A8592Cancel"
    cancel-lore: "&#C7D0D9Close"

  time:
    day: "day"
    day-plural: "days"

    hour: "hour"
    hour-plural: "hours"

    minute: "minute"
    minute-plural: "minutes"

    second: "second"
    second-plural: "seconds"

    short:
      day: "d"
      hour: "h"
      minute: "m"
      second: "s"

version: '9'